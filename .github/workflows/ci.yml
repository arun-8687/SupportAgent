name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sre_agent/requirements.txt
          pip install ruff

      - name: Ruff (syntax + undefined names)
        # Scoped to the "must never be broken" subset — the codebase predates a
        # full ruff style gate, so we block on real errors, not formatting.
        run: ruff check --select E9,F63,F7,F82 sre_agent

      - name: Pytest
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend (tsc + eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  image:
    name: Container image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the worker/API image (no push — that happens in the deploy
      # pipeline against your registry). This gates merges on the Dockerfile
      # and the prod dependency set staying installable.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sre-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
