name: adjust_hpa_memory_threshold
description: Raise an AKS Horizontal Pod Autoscaler max replica count so the service scales out under memory pressure.
category: scaling
risk: medium
parameters:
  - namespace
  - hpa_name
  - max_replicas
executor: shell
command: "kubectl patch hpa {hpa_name} -n {namespace} --patch '{{\"spec\":{{\"maxReplicas\":{max_replicas}}}}}'"
supports_rollback: true
rollback_command: "kubectl patch hpa {hpa_name} -n {namespace} --patch '{{\"spec\":{{\"maxReplicas\":{previous_max_replicas}}}}}'"
applies_to:
  - memory
  - scaling
  - hpa
  - aks
  - kubernetes
