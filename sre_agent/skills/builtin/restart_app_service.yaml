name: restart_app_service
description: Restart an Azure App Service to clear a wedged process or memory leak.
category: compute
risk: medium
parameters:
  - resource_group
  - app_name
executor: azure_cli
command: "az webapp restart --resource-group {resource_group} --name {app_name}"
verification_command: "az webapp show --resource-group {resource_group} --name {app_name} --query state -o tsv"
supports_rollback: false
applies_to:
  - memory
  - crash
  - hang
  - app_service
