# Workload Identity service account. The annotated client-id ties this SA to a
# User-Assigned Managed Identity federated with the cluster's OIDC issuer, so
# pods get Entra tokens with NO secrets on disk — used here to let the Key
# Vault CSI driver (and optionally KEDA / Postgres / Service Bus) authenticate.
#
# Setup (once):
#   az identity create -g $RG -n sre-agent-wi
#   az aks show -g $RG -n $AKS --query oidcIssuerProfile.issuerUrl -o tsv
#   az identity federated-credential create --name sre-agent-fed \
#     --identity-name sre-agent-wi -g $RG --issuer <OIDC_ISSUER> \
#     --subject system:serviceaccount:sre-agent:sre-agent --audience api://AzureADTokenExchange
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: sre-agent
  annotations:
    azure.workload.identity/client-id: "<MANAGED_IDENTITY_CLIENT_ID>"
  labels:
    azure.workload.identity/use: "true"
