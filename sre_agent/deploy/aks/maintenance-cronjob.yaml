# Retention: prune old checkpoints and DROP step-event partitions past the
# window. The always-on listener already sweeps this inline every 5 min, so
# this CronJob is belt-and-suspenders — and the safety net if you ever set the
# worker's KEDA minReplicaCount to 0 (scale-to-zero).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sre-agent-maintenance
  namespace: sre-agent
spec:
  schedule: "17 * * * *"          # hourly, offset off the top of the hour
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sre-agent
            app.kubernetes.io/component: maintenance
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: sre-agent
          restartPolicy: Never
          containers:
            - name: maintenance
              image: <ACR_LOGIN_SERVER>/sre-agent:<TAG>
              command: ["python", "-m", "sre_agent.main", "maintain"]
              envFrom:
                - configMapRef:
                    name: sre-agent-config
                - secretRef:
                    name: sre-agent-secrets
              volumeMounts:
                - name: kv
                  mountPath: /mnt/secrets-store
                  readOnly: true
          volumes:
            - name: kv
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: sre-agent-kv
