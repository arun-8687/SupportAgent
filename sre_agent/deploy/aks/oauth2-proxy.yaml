# oauth2-proxy in REVERSE-PROXY mode: it terminates the Entra (Azure AD) OIDC
# login and forwards authenticated requests to the API, injecting the ID token
# as `Authorization: Bearer` (--pass-authorization-header) so the API's bearer
# auth path reads identity + app roles. The Ingress points at THIS service.
#
# Entra app registration (once), for the CONSOLE:
#   - Redirect URI (Web): https://<HOST>/oauth2/callback
#   - Expose app roles "SRE.Viewer" and "SRE.Approver"; assign them to AD groups.
#   - Put client id/secret + a 32-byte cookie secret in Key Vault
#     (oauth2-proxy-client-id / -client-secret / -cookie-secret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: sre-agent
  labels:
    app.kubernetes.io/name: sre-agent
    app.kubernetes.io/component: oauth2-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-agent
        app.kubernetes.io/component: oauth2-proxy
        azure.workload.identity/use: "true"
    spec:
      # The SA + CSI mount let oauth2-proxy pull (and sync) its own Key Vault
      # secret via Workload Identity — no dependency on another pod's ordering.
      serviceAccountName: sre-agent
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://login.microsoftonline.com/<TENANT_ID>/v2.0
            - --http-address=0.0.0.0:4180
            - --upstream=http://sre-agent-api:8080
            - --redirect-url=https://<HOST>/oauth2/callback
            - --email-domain=*
            - --scope=openid profile email
            # Forward the ID token (carries the SRE.Viewer/SRE.Approver roles)
            # to the upstream as Authorization: Bearer.
            - --pass-authorization-header=true
            - --pass-access-token=true
            - --set-xauthrequest=true
            - --cookie-secure=true
            - --reverse-proxy=true
            # Health/readiness must not bounce through the login flow.
            - --skip-auth-regex=^/healthz$
            - --skip-auth-regex=^/readyz$
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - containerPort: 4180
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: kv
              mountPath: /mnt/secrets-store
              readOnly: true
      # Mounting the CSI volume triggers the Key Vault -> Secret sync that
      # produces oauth2-proxy-secrets (consumed via secretKeyRef above).
      volumes:
        - name: kv
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sre-agent-kv
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: sre-agent
  labels:
    app.kubernetes.io/name: sre-agent
    app.kubernetes.io/component: oauth2-proxy
spec:
  selector:
    app.kubernetes.io/component: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: 4180
