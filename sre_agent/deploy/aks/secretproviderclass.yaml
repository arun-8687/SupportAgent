# Azure Key Vault secrets, surfaced to pods via the Secrets Store CSI driver.
# The driver authenticates to Key Vault with the pod's Workload Identity
# (serviceaccount.yaml). `secretObjects` also SYNCS the values into a native
# k8s Secret (sre-agent-secrets) so containers can consume them as env vars
# — the sync only happens while a pod mounts the CSI volume, which the API
# and worker deployments do.
#
# Prereqs:
#   az aks enable-addons --addons azure-keyvault-secrets-provider -g $RG -n $AKS
#   Grant the managed identity 'get' on secrets in the vault (RBAC or policy).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sre-agent-kv
  namespace: sre-agent
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<MANAGED_IDENTITY_CLIENT_ID>"   # Workload Identity client id
    keyvaultName: "<KEYVAULT_NAME>"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: sre-database-url
          objectType: secret
        - |
          objectName: sre-servicebus-connection-string
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
        - |
          objectName: oauth2-proxy-client-id
          objectType: secret
        - |
          objectName: oauth2-proxy-client-secret
          objectType: secret
        - |
          objectName: oauth2-proxy-cookie-secret
          objectType: secret
  secretObjects:
    - secretName: sre-agent-secrets
      type: Opaque
      data:
        - objectName: sre-database-url
          key: SRE_AGENT_DATABASE_URL
        - objectName: sre-servicebus-connection-string
          key: SRE_AGENT_SERVICEBUS_CONNECTION_STRING
        - objectName: azure-openai-api-key
          key: SRE_AGENT_AZURE_OPENAI_API_KEY
        - objectName: appinsights-connection-string
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
    - secretName: oauth2-proxy-secrets
      type: Opaque
      data:
        - objectName: oauth2-proxy-client-id
          key: OAUTH2_PROXY_CLIENT_ID
        - objectName: oauth2-proxy-client-secret
          key: OAUTH2_PROXY_CLIENT_SECRET
        - objectName: oauth2-proxy-cookie-secret
          key: OAUTH2_PROXY_COOKIE_SECRET
