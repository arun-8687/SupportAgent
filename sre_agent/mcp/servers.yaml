# MCP server connections.
#
# Each entry becomes a set of extra tools available to subagents via the
# Model Context Protocol (loaded with langchain-mcp-adapters). Enabled
# servers' tools are loaded by the mcp_diagnostics subagent
# (subagents/mcp_diagnostics.py) at investigation time.
#
# The three first-party servers below ship in this package
# (sre_agent/mcp_servers/) and are enabled by default: they are read-only
# by construction (diagnostic verbs only — get/describe/logs/top for
# kubectl, show/list for az, search/list for knowledge) with no mutating
# tool, so there is nothing here for the permission gate to need to catch.
# Disable any you don't need (e.g. no AKS in your estate) to keep the
# tool catalog focused.

servers:
  - name: kubectl-readonly
    enabled: true
    transport: stdio
    command: python
    args: ["-m", "sre_agent.mcp_servers.kubectl_readonly"]

  - name: azure-readonly
    enabled: true
    transport: stdio
    command: python
    args: ["-m", "sre_agent.mcp_servers.azure_readonly"]

  - name: knowledge-search
    enabled: true
    transport: stdio
    command: python
    args: ["-m", "sre_agent.mcp_servers.knowledge_search"]

  # --- Third-party examples: disabled until you provide credentials ---

  - name: grafana
    enabled: false
    transport: streamable_http
    url: https://grafana.example.com/api/mcp
    headers:
      Authorization: "Bearer ${GRAFANA_MCP_TOKEN}"

  - name: prometheus
    enabled: false
    transport: stdio
    command: uvx
    args: ["mcp-server-prometheus"]
    env:
      PROMETHEUS_URL: "${PROMETHEUS_URL}"

  - name: github
    enabled: false
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}"
